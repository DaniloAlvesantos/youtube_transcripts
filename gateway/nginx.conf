worker_processes auto;

events {
    worker_connections 1024;
}

error_log /usr/local/openresty/nginx/logs/error.log warn;

http {
    limit_req_zone $binary_remote_addr zone=mylimit:1m rate=1r/s;

    log_format main 'ADDRESS: $remote_addr - TIME: [$time_local] - REQUEST: "$request" - RT:$request_time - URT:$upstream_response_time - STATUS: $status';

    lua_package_path "/usr/local/openresty/lua/?.lua;;";

    upstream python {
        least_conn;
        server api:5000 max_fails=1 fail_timeout=120s;
    }

    server {
        listen 80;
        server_name localhost;

        access_log /usr/local/openresty/nginx/logs/access.log main;

        location / {
            limit_req zone=mylimit burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://python;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /health {
            return 200 'OK';
        }

        location /lua/test {
            content_by_lua_file /usr/local/openresty/lua/test.lua;
        }

        location /ai {
            limit_req zone=mylimit burst=5 nodelay;
            limit_req_status 429;

            access_by_lua_file /usr/local/openresty/lua/security/security.ai.lua;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://python;

            body_filter_by_lua_file /usr/local/openresty/lua/get_body.lua;
            log_by_lua_file /usr/local/openresty/lua/analystic.lua;
        }
    }
}
